<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast</title>
<style>
  :root {
    --ink: #1C2A38;
    --ink-soft: #4B5C6B;
    --paper: #E9EEEC;
    --card: #F6F8F7;
    --line: #C6D1CD;
    --gold: #B9852C;
    --cold: #3B6E92;
    --warm: #B1543A;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
            "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  /* ---- Header / location strip ---- */
  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
    margin-bottom: 22px;
  }
  .masthead .place {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .masthead .meta {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-soft);
    text-align: right;
  }

  /* ---- Hero ---- */
  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 16px;
    margin-bottom: 28px;
  }
  .hero-temp {
    font-size: 92px;
    line-height: 0.9;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .hero-temp sup {
    font-size: 32px;
    font-weight: 400;
    top: -0.5em;
  }
  .hero-detail {
    font-size: 13px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--ink-soft);
    padding-bottom: 10px;
  }
  .hero-detail .cond {
    color: var(--ink);
    font-weight: 600;
    font-size: 15px;
  }

  .isobar {
    height: 46px;
    margin: -6px 0 26px;
  }
  .isobar path {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.3;
  }
  .isobar path.p2 { stroke: var(--cold); opacity: 0.55; }

  /* ---- Hourly strip ---- */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .hourly {
    display: flex;
    gap: 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    margin-bottom: 30px;
    overflow-x: auto;
  }
  .hour {
    flex: 0 0 62px;
    text-align: center;
    font-size: 11px;
    border-right: 1px solid var(--line);
  }
  .hour:last-child { border-right: none; }
  .hour .t { color: var(--ink-soft); margin-bottom: 8px; }
  .hour .v { font-size: 19px; font-weight: 600; margin-bottom: 6px; }
  .hour .p { color: var(--cold); font-size: 10px; }

  /* ---- 5-day table ---- */
  .days { margin-bottom: 30px; }
  .day-row {
    display: grid;
    grid-template-columns: 84px 1fr 48px auto 48px;
    align-items: center;
    gap: 14px;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .day-row:first-child { border-top: 1px solid var(--line); }
  .day-row .dname { font-weight: 600; }
  .day-row .dcond { color: var(--ink-soft); font-size: 12px; font-weight: 400; }
  .day-row .hi { text-align: right; font-size: 16px; font-weight: 600; }
  .day-row .lo { text-align: right; font-size: 16px; font-weight: 400; color: var(--ink-soft); }
  .range-track { position: relative; height: 3px; background: var(--line); }
  .range-fill {
    position: absolute;
    height: 3px;
    background: linear-gradient(90deg, var(--cold), var(--gold));
  }

  /* ---- Discussion ---- */
  .discussion {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 18px 20px;
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.75;
    color: var(--ink-soft);
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  .discussion .dhead {
    color: var(--ink);
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    white-space: normal;
  }

  .alert-banner {
    background: var(--warm);
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    padding: 10px 14px;
    margin-bottom: 20px;
    display: none;
  }

  .footnote {
    margin-top: 22px;
    font-size: 11px;
    font-weight: 400;
    color: var(--ink-soft);
    text-align: center;
  }

  .state-msg {
    font-size: 13px;
    color: var(--ink-soft);
    padding: 40px 0;
    text-align: center;
  }
</style>
</head>
<body>
<div class="sheet" id="app">
  <div class="state-msg" id="loading">Loading forecast…</div>
</div>

<script>
// Change these to move the app to a different location, or wire up
// geolocation / a search box later.
const LAT = 42.0987;
const LON = -75.9180;
const API_BASE = ""; // same-origin, backend serves this file too

async function loadForecast() {
  const app = document.getElementById("app");
  try {
    const res = await fetch(`${API_BASE}/api/forecast?lat=${LAT}&lon=${LON}`);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
    loadDiscussion();
    loadAlerts();
  } catch (err) {
    app.innerHTML = `<div class="state-msg">Couldn't load live forecast (${err.message}).<br>
      Check that the backend is running and reachable.</div>`;
  }
}

function render(data) {
  const app = document.getElementById("app");
  const daily = data.daily_periods || [];
  const hourly = data.hourly_periods || [];
  const now = hourly[0];
  const today = daily[0];

  const hourlyHtml = hourly.slice(0, 12).map(h => {
    const time = new Date(h.startTime);
    const label = time.toLocaleTimeString([], { hour: "numeric" }).replace(" ", "");
    const pop = h.probabilityOfPrecipitation?.value ?? 0;
    return `<div class="hour">
      <div class="t">${label}</div>
      <div class="v">${h.temperature}°</div>
      <div class="p">${pop}%</div>
    </div>`;
  }).join("");

  // Pair up day/night periods into 5-day rows
  const dayRows = [];
  for (let i = 0; i < daily.length && dayRows.length < 5; i++) {
    const p = daily[i];
    if (!p.isDaytime) continue;
    const night = daily[i + 1] && !daily[i + 1].isDaytime ? daily[i + 1] : null;
    dayRows.push({ day: p, night });
  }
  const allTemps = daily.map(p => p.temperature);
  const minT = Math.min(...allTemps), maxT = Math.max(...allTemps);
  const span = Math.max(1, maxT - minT);

  const daysHtml = dayRows.map(({ day, night }) => {
    const hi = day.temperature;
    const lo = night ? night.temperature : hi - 10;
    const leftPct = ((lo - minT) / (span + 20)) * 100;
    const rightPct = 100 - (((hi - minT) / (span + 20)) * 100) - 10;
    return `<div class="day-row">
      <div class="dname">${day.name.split(" ")[0]}</div>
      <div class="dcond">${day.shortForecast}</div>
      <div class="lo">${lo}°</div>
      <div class="range-track"><div class="range-fill" style="left:${leftPct}%;right:${rightPct}%"></div></div>
      <div class="hi">${hi}°</div>
    </div>`;
  }).join("");

  app.innerHTML = `
    <div class="alert-banner" id="alertBanner"></div>
    <div class="masthead">
      <div class="place">${data.location.city || "—"}, ${data.location.state || ""}</div>
      <div class="meta">NWS Office ${data.location.office || "—"}<br>Updated ${data.updated ? new Date(data.updated).toLocaleString() : "—"}</div>
    </div>

    <div class="hero">
      <div class="hero-temp">${now ? now.temperature : today.temperature}<sup>°F</sup></div>
      <div class="hero-detail">
        <div class="cond">${today.shortForecast}</div>
        Wind ${today.windDirection} ${today.windSpeed}
      </div>
    </div>

    <svg class="isobar" viewBox="0 0 700 46" preserveAspectRatio="none">
      <path class="p1" d="M0,30 C60,10 120,10 180,24 C240,38 300,38 360,20 C420,4 480,4 540,18 C600,32 660,32 700,22"/>
      <path class="p2" d="M0,36 C60,20 120,24 180,32 C240,40 300,30 360,26 C420,20 480,26 540,30 C600,34 660,28 700,30" />
    </svg>

    <div class="section-label">Next 12 hours</div>
    <div class="hourly">${hourlyHtml}</div>

    <div class="section-label">5-day outlook</div>
    <div class="days">${daysHtml}</div>

    <div id="discussionBox"></div>

    <div class="footnote">Live data from api.weather.gov (NOAA / National Weather Service)</div>
  `;
}

async function loadDiscussion() {
  const box = document.getElementById("discussionBox");
  if (!box) return;
  try {
    const res = await fetch(`${API_BASE}/api/discussion?lat=${LAT}&lon=${LON}`);
    const data = await res.json();
    if (data.error || !data.text) return;
    // Trim to a readable excerpt — full AFD text is long and fixed-width formatted
    const excerpt = data.text.split(/\n{2,}/).slice(0, 6).join("\n\n");
    box.innerHTML = `
      <div class="section-label" style="margin-top: 4px;">Forecast discussion</div>
      <div class="discussion">
        <div class="dhead"><span>NWS ${data.office}</span></div>
        ${excerpt}
      </div>`;
  } catch (err) {
    // Non-critical — just omit the discussion panel if it fails
  }
}

async function loadAlerts() {
  try {
    const res = await fetch(`${API_BASE}/api/alerts?lat=${LAT}&lon=${LON}`);
    const data = await res.json();
    const banner = document.getElementById("alertBanner");
    if (!banner || !data.alerts || data.alerts.length === 0) return;
    const first = data.alerts[0].properties;
    banner.style.display = "block";
    banner.textContent = `${first.event}: ${first.headline || first.description?.slice(0, 120)}`;
  } catch (err) {
    // Non-critical
  }
}

loadForecast();
</script>
</body>
</html>
